<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#5E0B16">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tour AP2M">
<link rel="manifest" href="manifest.json?v=3">
<link rel="icon" href="../icones/tour-192.png">
<link rel="apple-touch-icon" href="../icones/tour-180.png">
<title>Tour AP2M</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* « Tour AP2M » : la tour de contrôle sur le téléphone. Mêmes données que la tour du PC (document « taches »,
   tâches automatiques, macarons des outils), sans le bloc d'ajout : ajouter, c'est l'appli « Tâche AP2M ». */
:root{
  color-scheme:light;
  --page:#F4F2EE; --carte:#FFFFFF; --bordure:#E6E3DC; --encre:#23251F; --encre-2:#6E7067;
  --bordeaux:#5E0B16; --bordeaux-2:#7A1824; --bordeaux-pale:#F6E9EA;
  --rouge:#D13F37; --rouge-fond:#FFF5F4; --orange:#A86200; --orange-fond:#FBF0DD; --vert:#5B7054;
  --police:"Figtree", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--page);color:var(--encre);font:15px/1.4 var(--police)}
button,input{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--bordeaux-2);outline-offset:2px;border-radius:10px}
.page{max-width:560px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top, 0px)) 16px calc(24px + env(safe-area-inset-bottom, 0px))}

.haut{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:2px 0 10px}
.logo{display:flex;align-items:center;gap:8px;color:var(--bordeaux)}
.demi{width:11px;height:22px;border-radius:22px 0 0 22px;background:radial-gradient(circle at 100% 50%, #fff 0 .8px, transparent 1.2px) 0 0/4px 4px, var(--bordeaux)}
.logo b{display:block;font-size:15px;font-weight:800;line-height:1}
.logo small{display:block;font-size:10.5px;opacity:.8}
.date{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--encre-2);font-weight:600;text-align:right;line-height:1.25}
.synchro{width:9px;height:9px;border-radius:50%;background:var(--vert);flex:none}
.synchro.attente{background:var(--orange)}
.synchro.erreur{background:var(--rouge)}

/* Outils en icônes d'appli : 5 par ligne, macaron rouge */
.outils{display:grid;grid-template-columns:repeat(5,1fr);gap:10px 2px;padding:4px 0 12px;border-bottom:1px solid var(--bordure);margin-bottom:10px}
.om{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:none;padding:0;cursor:pointer;font-size:10.5px;font-weight:700;line-height:1.15;text-align:center;color:var(--encre);text-decoration:none}
.om i{width:46px;height:46px;border-radius:14px;background:var(--c);display:grid;place-items:center;box-shadow:0 2px 6px rgba(35,37,31,.12)}
.om i.logo-i{background:#fff;border:1px solid var(--bordure);overflow:hidden}
.om i img{width:100%;height:100%;object-fit:contain}
.om svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.om em{position:absolute;top:-5px;left:calc(50% + 10px);min-width:19px;height:19px;border-radius:999px;background:var(--rouge);color:#fff;font-style:normal;font-size:10.5px;font-weight:800;display:grid;place-items:center;padding:0 4px;border:2px solid var(--page)}
.om:active i{transform:scale(.94)}

.onglets{position:sticky;top:0;z-index:2;display:flex;gap:3px;background:#ECE9E3;border-radius:999px;padding:3px;margin-bottom:8px;box-shadow:0 0 0 6px var(--page)}
.onglets button{flex:1;border:0;background:none;border-radius:999px;padding:7px 4px;font-weight:700;font-size:12.5px;color:var(--encre-2);cursor:pointer}
.onglets button[aria-pressed="true"]{background:var(--carte);color:var(--encre);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.onglets span{font-weight:800;opacity:.7;margin-left:3px}

.filtre{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--bordeaux-pale);color:var(--bordeaux);border-radius:10px;padding:6px 10px;font-size:12.5px;font-weight:700;margin-bottom:8px}
.filtre button{border:0;background:none;color:inherit;font-weight:800;cursor:pointer;padding:0 2px}

/* Tâches en lignes fines */
.liste{display:flex;flex-direction:column;gap:6px}
.sem-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 0 2px}
.sem-nav b{font-size:13.5px}
.sem-nav small{display:block;font-size:11px;color:var(--encre-2);font-weight:600}
.sem-nav div{text-align:center;flex:1}
.fl{width:32px;height:32px;border-radius:50%;border:1px solid var(--bordure);background:var(--carte);font-size:17px;font-weight:800;cursor:pointer;color:var(--bordeaux)}
.sem-auj{border:1px solid var(--bordure);background:var(--carte);border-radius:999px;padding:4px 10px;font-size:11.5px;font-weight:700;cursor:pointer}
.jour-t{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--encre-2);margin:8px 2px 0}
.jour-t.auj{color:var(--bordeaux)}
.t{display:flex;align-items:center;gap:10px;background:var(--carte);border:1px solid var(--bordure);border-left:4px solid var(--bordure);border-radius:10px;padding:7px 8px 7px 10px;cursor:pointer}
.t.imp{border-left-color:var(--orange)}
.t.urg{border-color:var(--rouge);border-left-color:var(--rouge);background:var(--rouge-fond)}
.t.depot{border-left-color:var(--bordeaux)}
.t > div{flex:1;min-width:0}
.t .l1{display:flex;align-items:center;gap:6px}
.t .cl{font-size:10.5px;font-weight:800;color:var(--bordeaux);background:var(--bordeaux-pale);border-radius:5px;padding:0 6px}
.t .auto{font-size:9.5px;font-weight:800;color:var(--vert);border:1px solid var(--vert);border-radius:5px;padding:0 4px}
.t .pr{margin-left:auto;font-size:10px;font-weight:800;border-radius:999px;padding:0 7px}
.t .pr.u{background:var(--rouge);color:#fff}
.t .pr.i{background:var(--orange-fond);color:var(--orange)}
.t b{display:block;font-size:13.5px;font-weight:700;line-height:1.3;margin-top:2px;overflow-wrap:anywhere}
.t small{display:block;font-size:11px;color:var(--encre-2)}
.t small.rouge{color:var(--rouge);font-weight:700}
.t small.orange{color:var(--orange);font-weight:700}
.coche{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--bordure);background:var(--carte);cursor:pointer;display:grid;place-items:center;color:transparent;font-size:13px;font-weight:800}
.t.faite{opacity:.45}
.t.faite b{text-decoration:line-through}
.t.faite .coche{background:var(--vert);border-color:var(--vert);color:#fff}
.vide{font-size:12.5px;color:var(--encre-2);text-align:center;padding:14px 0}
.clients{display:flex;gap:5px;flex-wrap:wrap;padding:2px 0 4px}
.clients button{border:1px solid var(--bordure);background:var(--carte);border-radius:8px;padding:5px 8px;font-size:11px;font-weight:800;cursor:pointer}
.clients button[aria-pressed="true"]{background:var(--bordeaux);border-color:var(--bordeaux);color:#fff}
.clients i{font-style:normal;margin-left:4px;opacity:.65}
.pied{display:flex;justify-content:center;margin-top:22px}
.pied button{border:0;background:none;color:var(--encre-2);font-size:12px;font-weight:600;text-decoration:underline;cursor:pointer}

/* Fiche et plateformes : feuille qui monte du bas */
dialog{border:0;padding:0;margin:auto 0 0;width:100%;max-width:100%;max-height:85vh;border-radius:22px 22px 0 0;background:var(--carte);color:var(--encre)}
dialog::backdrop{background:rgba(35,37,31,.45)}
.f{padding:16px 16px calc(18px + env(safe-area-inset-bottom, 0px));display:flex;flex-direction:column;gap:12px;max-width:560px;margin:0 auto}
.f-h{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.f-h .cl{font-size:11.5px;font-weight:800;color:var(--bordeaux);background:var(--bordeaux-pale);border-radius:6px;padding:1px 7px}
.f-h .fermer{margin-left:auto;width:32px;height:32px;border-radius:50%;border:0;background:#ECE9E3;font-size:20px;line-height:1;cursor:pointer}
.f h3{margin:0;font-size:17px;font-weight:800;line-height:1.3}
.f .infos{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--encre-2)}
.f .infos b{color:var(--encre)}
.f ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.f li{display:flex;align-items:center;gap:8px;justify-content:space-between}
.f li label{display:flex;align-items:center;gap:8px}
.f li input{width:18px;height:18px;accent-color:var(--vert)}
.f li.ok label{text-decoration:line-through;color:var(--encre-2)}
.f .etat-p{font-size:11.5px;font-weight:700;color:var(--rouge)}
.f .etat-p.bientot{color:var(--orange)}
.f .note{font-size:13.5px;white-space:pre-wrap;background:var(--page);border-radius:10px;padding:8px 10px}
.f .titre-b{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--encre-2);margin-bottom:4px}
.lien-outil{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--bordure);border-radius:12px;padding:10px 12px;font-weight:700;color:var(--bordeaux);text-decoration:none;font-size:14px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.actions button{border:1px solid var(--bordure);background:var(--page);border-radius:12px;padding:11px 6px;font-size:13.5px;font-weight:700;cursor:pointer}
.actions .principal{grid-column:1 / -1;background:var(--bordeaux);border-color:var(--bordeaux);color:#fff}
.actions .danger{color:var(--rouge)}
.actions .danger.sur{background:var(--rouge);border-color:var(--rouge);color:#fff}
.plats{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.plats a{border:1px solid var(--bordure);background:var(--page);border-radius:12px;padding:12px;font-weight:700;font-size:14px;color:var(--encre);text-decoration:none;text-align:center}

.toast{position:fixed;left:16px;right:16px;bottom:calc(20px + env(safe-area-inset-bottom, 0px));max-width:520px;margin:0 auto;border-radius:14px;padding:12px 14px;font-weight:700;font-size:14px;text-align:center;color:#fff;background:var(--encre);opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none;z-index:5}
.toast.vu{opacity:1;transform:none}

/* Connexion */
.connexion{background:var(--carte);border:1px solid var(--bordure);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:12px;margin-top:8vh}
.connexion h2{margin:0;font-size:21px;font-weight:800}
.connexion p{margin:0;color:var(--encre-2);font-size:14.5px}
.connexion input{width:100%;border:1px solid var(--bordure);border-radius:14px;padding:13px;font-size:16px;background:var(--page)}
.connexion input:focus{outline:0;border-color:var(--bordeaux)}
.connexion button{border:0;border-radius:14px;padding:14px;background:var(--bordeaux);color:#fff;font-weight:800;font-size:16px}
.erreur-cx{color:var(--rouge);font-size:14px;font-weight:600;min-height:18px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="page">
  <header class="haut">
    <div class="logo"><div class="demi" aria-hidden="true"></div><div><b>AP2M Gestion</b><small>Tour de contrôle</small></div></div>
    <div class="date"><span id="jour"></span><i class="synchro" id="synchro" title="Enregistré" hidden></i></div>
  </header>

  <form class="connexion" id="connexion" hidden>
    <h2>Connexion</h2>
    <p>Avec ton compte AP2M. Le téléphone s'en souviendra.</p>
    <input id="cx-email" type="email" autocomplete="username" placeholder="Adresse e-mail" aria-label="Adresse e-mail" required>
    <input id="cx-mdp" type="password" autocomplete="current-password" placeholder="Mot de passe" aria-label="Mot de passe" required>
    <div class="erreur-cx" id="cx-erreur" role="alert"></div>
    <button id="cx-btn">Se connecter</button>
  </form>

  <main id="app" hidden>
    <nav class="outils" id="outils" aria-label="Mes outils"></nav>
    <div class="onglets" role="group" aria-label="Vue" id="onglets">
      <button type="button" aria-pressed="true" data-o="auj">Aujourd'hui<span id="n-auj"></span></button>
      <button type="button" aria-pressed="false" data-o="sem">Semaine</button>
      <button type="button" aria-pressed="false" data-o="placer">À placer<span id="n-placer"></span></button>
    </div>
    <div class="filtre" id="filtre" hidden></div>
    <div class="liste" id="liste"></div>
    <div class="jour-t">Mes clients</div>
    <div class="clients" id="clients"></div>
    <div class="pied"><button type="button" id="deconnexion">Se déconnecter</button></div>
  </main>
</div>

<dialog id="fiche" aria-label="Tâche"><div class="f" id="f"></div></dialog>
<dialog id="plateformes" aria-label="Plateformes"><div class="f">
  <div class="f-h"><h3>Plateformes</h3><button class="fermer" type="button" data-fermer aria-label="Fermer">×</button></div>
  <nav class="plats">
    <a href="https://www.marches-publics.gouv.fr" target="_blank" rel="noopener">PLACE</a>
    <a href="https://www.urssaf.fr" target="_blank" rel="noopener">URSSAF</a>
    <a href="https://www.net-entreprises.fr" target="_blank" rel="noopener">Net-Entreprises</a>
    <a href="https://www.impots.gouv.fr" target="_blank" rel="noopener">Impôts Pro</a>
    <a href="https://www.infogreffe.fr" target="_blank" rel="noopener">Infogreffe</a>
    <a href="https://www.cibtp.fr" target="_blank" rel="noopener">CIBTP</a>
    <a href="https://www.probtp.com" target="_blank" rel="noopener">PRO BTP</a>
    <a href="https://portail.chorus-pro.gouv.fr" target="_blank" rel="noopener">Chorus Pro</a>
    <a href="https://www.boamp.fr" target="_blank" rel="noopener">BOAMP</a>
  </nav>
</div></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<script src="https://marine-ap2m.github.io/tour-de-controle/prtech-taches.js"></script>
<script>
/* Même projet et même clé publiable que la tour du PC : la connexion et les données sont partagées. */
const SUPABASE_URL = "https://zhgqqaedtmeowpjadtqr.supabase.co";
const SUPABASE_KEY = "sb_publishable_a0Qkyol-vdG3EtWxGH4t5Q_JciGIacC";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false } });
const GH = "https://marine-ap2m.github.io/";
const URL_DEPOT = GH + "depot/admin/", URL_ATTESTATIONS = GH + "attestationslegales/", URL_VEILLE = GH + "tour-de-controle/veille-ao.html";
const CLE = 'taches';

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pluriel = (n, un, plusieurs) => n + ' ' + (n > 1 ? plusieurs : un);
function toast(m){ const t = $('#toast'); t.textContent = m; t.classList.add('vu'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('vu'), 2400); }
const tic = () => { $('#jour').textContent = new Date().toLocaleDateString('fr-FR', { weekday:'long', day:'numeric', month:'long' }); };
tic(); setInterval(tic, 60000);

const CLIENTS = ['SMA','WEC','M2S','PRTECH','ECB','NRD','PATMA','MRCONSEILS','ORIA','AP2M'];
const COLONNES = { auj:"Aujourd'hui", semaine:'Cette semaine', plus:'Plus tard', attente:'En attente du client', fait:'Fait' };

/* ---------- Dates (mêmes règles que la tour du PC) ---------- */
const isoJour = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const aujourdhui = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const deIso = iso => { const [a, m, j] = String(iso).slice(0, 10).split('-').map(Number); return new Date(a, m - 1, j); };
const joursAvant = iso => Math.round((deIso(iso) - aujourdhui()) / 86400000);
const dateCourte = iso => deIso(iso).toLocaleDateString('fr-FR', { weekday:'short', day:'numeric', month:'short' });
const lundiDe = d => { const x = new Date(d); x.setHours(0, 0, 0, 0); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; };
const plusJours = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const lundiCourant = () => lundiDe(new Date(Date.now() + 12 * 3600000));
const numSemaine = d => { const x = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); x.setUTCDate(x.getUTCDate() + 4 - (x.getUTCDay() || 7)); return Math.ceil(((x - Date.UTC(x.getUTCFullYear(), 0, 1)) / 86400000 + 1) / 7); };
function colDe(iso){
  if (iso === isoJour(aujourdhui())) return 'auj';
  return iso <= isoJour(plusJours(lundiCourant(), 6)) ? 'semaine' : 'plus';
}
function echeance(t){
  if (t.col === 'fait') return [t.faiteLe ? 'Fait ' + dateCourte(t.faiteLe) : 'Fait', ''];
  if (!t.ech) return null;
  const n = joursAvant(t.ech);
  if (t.auto === 'ao'){
    const jour = n === 0 ? "aujourd'hui" : n === 1 ? 'demain' : dateCourte(t.ech);
    return ['Dépôt ' + jour + (t.heure ? ' à ' + t.heure : ''), n <= 2 ? 'rouge' : n <= 7 ? 'orange' : ''];
  }
  if (n < 0) return ['En retard de ' + (-n) + ' j', 'rouge'];
  if (n === 0) return ["Aujourd'hui", 'rouge'];
  if (n === 1) return ['Demain', 'rouge'];
  return [dateCourte(t.ech), n <= 7 ? 'orange' : ''];
}

/* ---------- Tâches enregistrées (document « taches », le même que sur le PC) ---------- */
let DOC = { taches: [], auto: {}, jours: {}, seq: 1 }, VERSION = null, charge = false;
let minuteurEnr = null, enCours = false, aRefaire = false;
function etatSynchro(classe, texte){ const s = $('#synchro'); s.className = 'synchro' + (classe ? ' ' + classe : ''); s.title = texte; }
function modifier(){ etatSynchro('attente', 'Enregistrement…'); clearTimeout(minuteurEnr); minuteurEnr = setTimeout(enregistrer, 400); afficher(); }
async function enregistrer(){
  if (!charge) return;
  if (enCours){ aRefaire = true; return; }
  enCours = true;
  try{
    const { data, error } = await sb.rpc('cockpit_enregistrer', { p_cle: CLE, p_donnees: DOC, p_version_lue: VERSION });
    if (error) throw error;
    if (data && data.ok){ VERSION = Number(data.version); etatSynchro('', 'Enregistré'); }
    else { aRefaire = false; await lire(); afficher(); toast('Modifié sur un autre appareil : la liste a été rechargée'); }
  }catch(e){ etatSynchro('erreur', 'Pas enregistré, nouvel essai…'); clearTimeout(minuteurEnr); minuteurEnr = setTimeout(enregistrer, 5000); }
  enCours = false;
  if (aRefaire){ aRefaire = false; enregistrer(); }
}
const enAttente = () => enCours || aRefaire || /attente|erreur/.test($('#synchro').className);
function normaliser(d){
  d = d && typeof d === 'object' ? d : {};
  return { ...d, taches: Array.isArray(d.taches) ? d.taches : [], auto: d.auto && typeof d.auto === 'object' ? d.auto : {}, jours: d.jours && typeof d.jours === 'object' ? d.jours : {}, seq: Number(d.seq) || 1 };
}
/* Même report que sur le PC : ce qui n'est pas fait passe à la semaine suivante dès le dimanche 12 h. */
function recalerPlanning(){
  const debut = isoJour(lundiCourant()); let change = false;
  const reporte = iso => { let d = deIso(iso); while (isoJour(d) < debut) d = plusJours(d, 7); return isoJour(d); };
  for (const t of DOC.taches){
    if (!t.jour || t.col === 'fait') continue;
    if (t.jour < debut){ if (!t.reporteeDe) t.reporteeDe = numSemaine(deIso(t.jour)); t.jour = reporte(t.jour); change = true; }
    if (t.col !== 'attente' && t.col !== colDe(t.jour)){ t.col = colDe(t.jour); change = true; }
  }
  for (const id of Object.keys(DOC.jours)){
    if (DOC.jours[id] < debut){ DOC.jours[id] = reporte(DOC.jours[id]); change = true; }
    if (DOC.auto[id] !== 'attente' && DOC.auto[id] !== colDe(DOC.jours[id])){ DOC.auto[id] = colDe(DOC.jours[id]); change = true; }
  }
  return change;
}
async function lire(){
  const { data, error } = await sb.from('cockpit_donnees').select('donnees, version').eq('cle', CLE).maybeSingle();
  if (error) throw error;
  if (!data) throw new Error('premiere');
  DOC = normaliser(data.donnees); VERSION = Number(data.version); charge = true; etatSynchro('', 'Enregistré');
}

let AUTO = [], ETATS = { depot:null, attest:null, veille:null, memoire:null, prtech:null };
const CATALOGUE = [['urssaf','URSSAF',0],['fiscale','Régularité fiscale',0],['conges','CIBTP',0],['probtp','PRO BTP',0],['rcpro','RC Pro',0],['decennale','Décennale',0],['kbis','Kbis',0],['rib','RIB',0],['identite','Identité et cartes BTP',0],['etrangers','Salariés étrangers',1],['habilitations','Habilitations',1],['rge','RGE',1]];
const SEUIL_JOURS = 45;
function statutPiece(d, conditionnelle){
  d = d || {};
  if (d.present === 'na') return ['na'];
  if (!d.emission) return [conditionnelle ? 'na' : 'miss'];
  if (!d.validite) return [d.file ? 'ok' : 'nodoc'];
  const j = joursAvant(d.validite);
  if (j < 0) return ['exp', j];
  if (!d.file) return ['nodoc', j];
  return [j <= SEUIL_JOURS ? 'soon' : 'ok', j];
}
const norme = s => String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
const clientDe = (...noms) => { for (const n of noms){ const x = norme(n); if (!x) continue; const c = CLIENTS.find(c => x === c || x.startsWith(c) || c.startsWith(x)); if (c) return c; } return String(noms.find(Boolean) || 'AP2M').toUpperCase().slice(0, 14); };

async function lireAuto(){
  const liste = [], etats = { ...ETATS };
  const [dep, att, veille, memoire, prtech] = await Promise.allSettled([
    sb.rpc('cockpit_compteurs_depot'),
    sb.from('ap2m_attestations').select('id, data'),
    (async () => {
      const { data: { session } } = await sb.auth.getSession(); if (!session) return null;
      const r = await fetch(SUPABASE_URL + '/functions/v1/veille-digest', { method:'POST', headers:{ 'Content-Type':'application/json', 'apikey':SUPABASE_KEY, 'Authorization':'Bearer ' + session.access_token }, body: JSON.stringify({ action:'liste' }) });
      return r.ok ? r.json() : null;
    })(),
    sb.rpc('tour_retours_memoire'),
    window.PRTECH ? window.PRTECH.lire(sb) : Promise.reject(new Error('prtech')),
  ]);
  if (prtech.status === 'fulfilled'){ etats.prtech = prtech.value; for (const t of prtech.value.taches) liste.push(t); }
  if (memoire.status === 'fulfilled' && !memoire.value.error && memoire.value.data) etats.memoire = memoire.value.data;
  if (dep.status === 'fulfilled' && !dep.value.error){
    let aTraiter = 0, enAttenteN = 0;
    for (const l of dep.value.data || []){
      const n = Number(l.a_traiter); aTraiter += n || 0; enAttenteN += Number(l.en_attente) || 0;
      if (!n) continue;
      liste.push({ id:'depot:' + l.code, auto:'depot', c: clientDe(l.code, l.libelle), t:'Traiter ' + pluriel(n, 'pièce déposée', 'pièces déposées'), p:1, ech:null, colDefaut:'auj', src:'Depuis le dépôt de pièces', url: URL_DEPOT, outil:'Ouvrir le dépôt' });
    }
    etats.depot = { aTraiter, enAttente: enAttenteN };
  }
  if (att.status === 'fulfilled' && !att.value.error){
    let totalRegul = 0, totalBientot = 0;
    for (const l of att.value.data || []){
      const docs = (l.data && l.data.docs) || {}, pieces = []; let expirees = 0, aRegul = 0;
      for (const [cle, court, cond] of CATALOGUE){
        const [code, j] = statutPiece(docs[cle], !!cond);
        if (code === 'exp'){ expirees++; aRegul++; pieces.push([court, 'Expirée depuis ' + (-j) + ' j', '']); }
        else if (code === 'miss'){ aRegul++; pieces.push([court, 'Manquante', '']); }
        else if (code === 'nodoc'){ aRegul++; pieces.push([court, 'Document à joindre', '']); }
        else if (code === 'soon'){ pieces.push([court, 'Expire dans ' + j + ' j', 'bientot']); }
      }
      const bientot = pieces.length - aRegul; totalRegul += aRegul; totalBientot += bientot;
      if (!pieces.length) continue;
      liste.push({ id:'att:' + l.id, auto:'att', c: clientDe(l.data && l.data.code, l.data && l.data.nom), ech:null, pieces,
        t: aRegul ? 'Régulariser ' + pluriel(aRegul, 'attestation', 'attestations') : 'Renouveler ' + pluriel(bientot, 'attestation', 'attestations'),
        p: expirees ? 2 : aRegul ? 1 : 0, colDefaut: aRegul ? 'semaine' : 'plus', src:'Depuis les attestations', url: URL_ATTESTATIONS, outil:'Ouvrir les attestations' });
    }

    /* Un pli à déposer seulement quand le CLIENT a répondu « oui » dans son espace client. */
    for (const l of veille.value.lignes){
      if (!l.date_limite || ['depose', 'hors_cible', 'rejete', 'clos'].includes(l.statut)) continue;
      const oui = (Array.isArray(l.decisions) ? l.decisions : []).filter(d => d && d.decision === 'oui');
      if (!oui.length) continue;
      const limite = new Date(l.date_limite), ech = isoJour(limite), j = joursAvant(ech); if (j < 0) continue;
      const heure = limite.toLocaleTimeString('fr-FR', { hour:'2-digit', minute:'2-digit' }).replace(':', 'h');
      for (const c of new Set(oui.map(d => clientDe(d.code, d.libelle)))){
        liste.push({ id:'ao:' + l.id + ':' + c, auto:'ao', c, t:'Déposer le pli · ' + (l.acheteur || l.intitule || "appel d'offres"), p: j <= 2 ? 2 : j <= 7 ? 1 : 0, ech, heure,
          colDefaut: j <= 2 ? 'auj' : j <= 7 ? 'semaine' : 'plus', src: 'Veille AO · validé par le client', url: URL_VEILLE, outil:'Ouvrir la veille AO', note: l.intitule || '' });
      }
    }
    const etape = l => l.statut === 'hors_cible' ? 0 : l.statut === 'depose' ? 7 : l.validation_dossier_id ? 6
      : (l.pre_etude && (l.pre_etude.publie_pour || []).length) ? 5 : l.pre_etude ? 4 : (l.dce || []).length ? 3 : l.statut === 'en_cours' ? 2 : 1;

    };

}

const signature = a => 'masque:' + (a.cleMasque || a.t + '|' + (a.info ? a.info[0] : '') + '|' + (a.ech || ''));

/* ---------- Déplacer (mêmes règles que le PC) ---------- */
function jourApres(jour, col){
  if (!jour || col === 'fait' || col === 'attente') return jour || null;
  const a = isoJour(aujourdhui()), finSemaine = isoJour(plusJours(lundiCourant(), 6));
  if (col === 'auj') return a;
  if (col === 'semaine') return jour !== a && colDe(jour) === 'semaine' ? jour : null;
  return jour > finSemaine ? jour : null;
}
function deplacer(id, col){
  const t = trouver(id); if (!t || t.col === col) return;
  if (t.auto){
    if (col === 'fait') return toast("Tâche automatique : elle disparaît toute seule quand c'est fait dans l'outil");
    if (t.auto === 'ao' && t.p === 2 && col !== 'auj') return toast("Dépôt dans 2 jours ou moins : elle reste dans « Aujourd'hui »");
    DOC.auto[t.id] = col;
    const j = jourApres(DOC.jours[t.id], col); if (j) DOC.jours[t.id] = j; else delete DOC.jours[t.id];
  } else {
    t.col = col;
    if (col === 'fait') t.faiteLe = isoJour(new Date()); else delete t.faiteLe;
    const j = jourApres(t.jour, col); if (j) t.jour = j; else delete t.jour;
  }
  modifier();
  toast(col === 'fait' ? 'Tâche terminée ✓' : 'Déplacée dans « ' + COLONNES[col] + ' »');
}

    ${t.et && t.et.length ? `<div><div class="titre-b">Étapes</div><ul>${t.et.map((x, i) => `<li class="${x[1] ? 'ok' : ''}"><label><input type="checkbox" data-e="${i}" ${x[1] ? 'checked' : ''}>${esc(x[0])}</label></li>`).join('')}</ul></div>` : ''}
    ${t.pieces ? `<div><div class="titre-b">Pièces concernées</div><ul>${t.pieces.map(p => `<li><span>${esc(p[0])}</span><span class="etat-p ${p[2]}">${esc(p[1])}</span></li>`).join('')}</ul></div>` : ''}
    ${t.note ? `<div><div class="titre-b">Note</div><div class="note">${esc(t.note)}</div></div>` : ''}
    ${t.url ? `<a class="lien-outil" href="${esc(t.url)}"${/^https?:/.test(t.url) ? ' target="_blank" rel="noopener"' : ''}>${esc(t.outil)}<span>↗</span></a>` : ''}
    <div class="actions">
      ${t.auto ? '' : t.col === 'fait' ? '<button class="principal" data-a="semaine">Remettre à faire</button>' : '<button class="principal" data-a="fait">Terminer</button>'}
      ${t.col !== 'auj' && t.col !== 'fait' ? `<button${t.auto ? ' class="principal"' : ''} data-a="auj">Faire aujourd'hui</button>` : ''}
      ${t.col === 'auj' ? '<button data-a="semaine">Cette semaine</button>' : ''}
      ${t.col !== 'plus' && t.col !== 'fait' ? '<button data-a="plus">Plus tard</button>' : ''}
      ${!t.auto && t.col !== 'attente' && t.col !== 'fait' ? '<button data-a="attente">En attente client</button>' : ''}
      ${t.auto ? '<button class="danger" data-a="masquer">Supprimer</button>' : `<button data-a="prio">${t.p === 2 ? 'Enlever « urgent »' : 'Passer en urgent'}</button><button class="danger" data-a="supprimer">Supprimer</button>`}
    </div>`;
  if (!$('#fiche').open) $('#fiche').showModal();
}
$('#fiche').addEventListener('click', e => {
  if (e.target === $('#fiche')) return $('#fiche').close();
  const a = e.target.closest('[data-a]'); if (!a) return;
  const t = trouver(ouverte), act = a.dataset.a;
  if (act === 'fermer' || !t) return $('#fiche').close();
  if (act === 'prio'){ t.p = t.p === 2 ? 0 : 2; modifier(); return ouvrir(ouverte); }
  if (act === 'masquer'){
    if (!a.classList.contains('sur')){ a.classList.add('sur'); a.textContent = 'Confirmer la suppression'; return; }
    DOC.auto[t.id] = signature(t); delete DOC.jours[t.id]; $('#fiche').close(); modifier();
    return toast('Tâche supprimée. Elle reviendra seulement si la situation change.');
  }
  if (act === 'supprimer'){
    if (!a.classList.contains('sur')){ a.classList.add('sur'); a.textContent = 'Confirmer'; return; }
    DOC.taches = DOC.taches.filter(x => x.id !== t.id); $('#fiche').close(); modifier(); return toast('Tâche supprimée');
  }
  $('#fiche').close(); deplacer(ouverte, act);
});
$('#fiche').addEventListener('change', e => {
  const i = e.target.dataset.e; if (i == null) return;
  const t = trouver(ouverte); if (!t || !t.et) return;
  t.et[i][1] = e.target.checked ? 1 : 0; modifier(); ouvrir(ouverte);
});

/* ---------- Connexion et chargement ---------- */
let minuteur = null;
async function charger(){
  try{
    if (!enAttente()) await lire();
    if (charge && recalerPlanning()) modifier(); else afficher();
    await lireAuto(); afficher();
  }catch(e){
    etatSynchro('erreur', 'Lecture impossible');
    const m = String(e && e.message || '');
    if (!charge) $('#liste').innerHTML = `<div class="vide">${m === 'premiere' ? "Ouvre d'abord la tour une fois sur l'ordinateur." : /refus|permission/i.test(m) ? "Ce compte n'est pas membre AP2M." : 'Impossible de lire les tâches : vérifie le réseau.'}</div>`;
  }
}
function montrer(connecte){
  $('#connexion').hidden = connecte; $('#app').hidden = !connecte; $('#synchro').hidden = !connecte;
  clearInterval(minuteur);
  if (connecte){ afficherOutils(); charger(); minuteur = setInterval(charger, 2 * 60000); }
  else { DOC = { taches: [], auto: {}, jours: {}, seq: 1 }; VERSION = null; charge = false; AUTO = []; ETATS = { depot:null, attest:null, veille:null, memoire:null, prtech:null }; }
}
/* Quand on revient sur l'appli, on relit : ce qui a été fait sur le PC apparaît tout de suite. */
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && !$('#app').hidden && !$('#fiche').open) charger(); });
$('#connexion').addEventListener('submit', async e => {
  e.preventDefault();
  $('#cx-erreur').textContent = ''; $('#cx-btn').textContent = 'Connexion…';
  const { error } = await sb.auth.signInWithPassword({ email: $('#cx-email').value.trim(), password: $('#cx-mdp').value });
  $('#cx-btn').textContent = 'Se connecter';
  if (error){ $('#cx-erreur').textContent = "Connexion refusée. Vérifie l'e-mail et le mot de passe."; return; }
  $('#cx-mdp').value = '';
});
$('#deconnexion').addEventListener('click', async () => { await sb.auth.signOut(); });
let etatConnexion = null;
function surSession(session){ const c = !!session; if (c === etatConnexion) return; etatConnexion = c; montrer(c); }
sb.auth.onAuthStateChange((_evt, session) => surSession(session));
sb.auth.getSession().then(({ data }) => surSession(data.session));
</script>
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});</script>
