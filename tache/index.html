<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#5E0B16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tâche AP2M">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json?v=3">
<link rel="icon" href="../icones/tache-192.png">
<link rel="apple-touch-icon" href="../icones/tache-180.png">
<title>Tâche AP2M</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* « Tâche AP2M » : saisie rapide d'une tâche depuis le téléphone. Une case, le micro, un client, une priorité,
   et la tâche part dans le document « taches » de la tour de contrôle (même format que la tour). */
:root{
  color-scheme:light;
  --page:#F4F2EE; --carte:#FFFFFF; --bordure:#E6E3DC; --encre:#23251F; --encre-2:#6E7067;
  --bordeaux:#5E0B16; --bordeaux-2:#7A1824; --bordeaux-pale:#F6E9EA;
  --rouge:#D13F37; --rouge-fond:#FDECEA; --orange:#A86200; --orange-fond:#FBF0DD; --vert:#5B7054;
  --police:"Figtree", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--encre);font:17px/1.4 var(--police)}
button,input,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--bordeaux-2);outline-offset:2px;border-radius:12px}

.page{min-height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:16px;
  padding:calc(14px + env(safe-area-inset-top, 0px)) 18px calc(18px + env(safe-area-inset-bottom, 0px))}
.haut{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:9px;color:var(--bordeaux)}
.demi{width:14px;height:28px;border-radius:28px 0 0 28px;background:radial-gradient(circle at 100% 50%, #fff 0 .8px, transparent 1.2px) 0 0/4px 4px, var(--bordeaux)}
.logo b{display:block;font-size:18px;font-weight:800;line-height:1}
.logo small{display:block;font-size:12px;opacity:.8}
.vers-tour{font-size:14px;font-weight:700;color:var(--bordeaux);text-decoration:none;border:1px solid var(--bordure);background:var(--carte);border-radius:999px;padding:7px 13px}

h1{margin:4px 0 0;font-size:24px;font-weight:800;color:var(--bordeaux)}
.saisie{display:flex;gap:10px;align-items:stretch}
textarea{flex:1;min-width:0;min-height:96px;resize:none;border:2px solid var(--bordure);border-radius:18px;padding:14px;font-size:18px;background:var(--carte)}
textarea:focus{outline:0;border-color:var(--bordeaux)}
.micro{flex:none;width:64px;border:0;border-radius:18px;background:var(--bordeaux-pale);color:var(--bordeaux);cursor:pointer;display:grid;place-items:center}
.micro svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.micro.ecoute{background:var(--rouge);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 9px rgba(209,63,55,.22)}}
.lab{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--encre-2);margin-bottom:-8px}
.puces{display:flex;flex-wrap:wrap;gap:8px}
.puces button{border:1px solid var(--bordure);background:var(--carte);border-radius:999px;padding:10px 15px;font-size:15px;font-weight:700;cursor:pointer}
.puces button[aria-pressed="true"]{background:var(--bordeaux);border-color:var(--bordeaux);color:#fff}
.prios{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.prios button{border:1px solid var(--bordure);background:var(--carte);border-radius:16px;padding:13px 4px;font-size:16px;font-weight:700;cursor:pointer}
.prios button[aria-pressed="true"]{border-color:var(--encre);box-shadow:0 0 0 1px var(--encre)}
.prios button.i[aria-pressed="true"]{border-color:var(--orange);color:var(--orange);background:var(--orange-fond);box-shadow:0 0 0 1px var(--orange)}
.prios button.u[aria-pressed="true"]{border-color:var(--rouge);color:var(--rouge);background:var(--rouge-fond);box-shadow:0 0 0 1px var(--rouge)}
.envoyer{margin-top:auto;border:0;background:var(--bordeaux);color:#fff;border-radius:20px;padding:19px;font-size:19px;font-weight:800;cursor:pointer}
.envoyer:disabled{opacity:.5}
.aide{margin:0;font-size:13px;color:var(--encre-2);text-align:center}
.message{position:fixed;left:18px;right:18px;bottom:calc(96px + env(safe-area-inset-bottom, 0px));max-width:484px;margin:0 auto;border-radius:16px;padding:15px 16px;font-weight:800;text-align:center;color:#fff;background:var(--vert);opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none}
.message.erreur{background:var(--rouge)}
.message.vu{opacity:1;transform:none}

/* Connexion */
.connexion{background:var(--carte);border:1px solid var(--bordure);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:12px;margin-top:8vh}
.connexion h2{margin:0;font-size:22px;font-weight:800}
.connexion p{margin:0;color:var(--encre-2);font-size:15px}
.connexion input{width:100%;border:1px solid var(--bordure);border-radius:14px;padding:14px;font-size:17px;background:var(--page)}
.connexion input:focus{outline:0;border-color:var(--bordeaux)}
.connexion button{border:0;border-radius:14px;padding:15px;background:var(--bordeaux);color:#fff;font-weight:800;font-size:17px}
.erreur-cx{color:var(--rouge);font-size:14px;font-weight:600;min-height:18px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="page">
  <header class="haut">
    <div class="logo"><div class="demi" aria-hidden="true"></div><div><b>AP2M Gestion</b><small>Tâche rapide</small></div></div>
    <a class="vers-tour" href="../tour/" id="vers-tour" hidden>Ouvrir la tour</a>
  </header>

  <form class="connexion" id="e-connexion" hidden>
    <h2>Connexion</h2>
    <p>Avec ton compte AP2M. Le téléphone s'en souviendra.</p>
    <input id="cx-email" type="email" autocomplete="username" placeholder="Adresse e-mail" aria-label="Adresse e-mail" required>
    <input id="cx-mdp" type="password" autocomplete="current-password" placeholder="Mot de passe" aria-label="Mot de passe" required>
    <div class="erreur-cx" id="cx-erreur" role="alert"></div>
    <button id="cx-btn">Se connecter</button>
  </form>

  <form id="e-saisie" hidden style="display:flex;flex-direction:column;gap:18px;flex:1">
    <h1>Nouvelle tâche</h1>
    <div class="saisie">
      <textarea id="titre" placeholder="Qu'est-ce qu'il faut faire ?" aria-label="Tâche" maxlength="160" enterkeyhint="send"></textarea>
      <button class="micro" type="button" id="micro" aria-label="Dicter la tâche" hidden><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
    </div>
    <div class="lab">Client</div>
    <div class="puces" id="clients" role="group" aria-label="Client"></div>
    <div class="lab">Priorité</div>
    <div class="prios" id="prio" role="group" aria-label="Priorité">
      <button type="button" aria-pressed="true" data-p="0">Normal</button>
      <button type="button" class="i" aria-pressed="false" data-p="1">Important</button>
      <button type="button" class="u" aria-pressed="false" data-p="2">Urgent</button>
    </div>
    <button class="envoyer" id="envoyer" disabled>Envoyer dans la tour</button>
    <p class="aide">Urgente : elle arrive dans « Aujourd'hui ». Sinon : dans « À placer ».</p>
  </form>
</div>
<div class="message" id="message" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = "https://zhgqqaedtmeowpjadtqr.supabase.co";
const SUPABASE_KEY = "sb_publishable_a0Qkyol-vdG3EtWxGH4t5Q_JciGIacC";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false } });
const CLIENTS = ['SMA','WEC','M2S','PRTECH','ECB','NRD','PATMA','MRCONSEILS','ORIA','AP2M'];
const $ = s => document.querySelector(s);
const lire = (k, d) => { try { return localStorage.getItem(k) || d; } catch(e){ return d; } };
const garder = (k, v) => { try { localStorage.setItem(k, v); } catch(e){} };

function message(texte, erreur){
  const m = $('#message'); m.textContent = texte; m.classList.toggle('erreur', !!erreur); m.classList.add('vu');
  clearTimeout(m._h); m._h = setTimeout(() => m.classList.remove('vu'), erreur ? 4000 : 2200);
}
const isoJour = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');

/* ---------- Choix du client et de la priorité ---------- */
let client = CLIENTS.includes(lire('ap2m-ajout-client', 'SMA')) ? lire('ap2m-ajout-client', 'SMA') : 'SMA', prio = 0;
function choisirClient(c){
  client = c; garder('ap2m-ajout-client', c);
  document.querySelectorAll('#clients button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.c === c)));
}
$('#clients').innerHTML = CLIENTS.map(c => `<button type="button" data-c="${c}" aria-pressed="false">${c}</button>`).join('');
choisirClient(client);
$('#clients').addEventListener('click', e => { const b = e.target.closest('button'); if (b) choisirClient(b.dataset.c); });
function choisirPrio(p){ prio = p; document.querySelectorAll('#prio button').forEach(b => b.setAttribute('aria-pressed', String(Number(b.dataset.p) === p))); }
$('#prio').addEventListener('click', e => { const b = e.target.closest('button'); if (b) choisirPrio(Number(b.dataset.p)); });
const majBouton = () => { $('#envoyer').disabled = !$('#titre').value.trim(); };
$('#titre').addEventListener('input', majBouton);
$('#titre').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); $('#e-saisie').requestSubmit(); } });

/* Un nom de client dit ou tapé au début (« SMA relancer la facture ») choisit le client tout seul. */
function reconnaitreClient(texte){
  const m = /^\s*([A-Za-zÀ-ÿ0-9.\- ]{2,14}?)\s*[:,-]?\s+(.+)$/.exec(texte); if (!m) return texte;
  const mot = m[1].toUpperCase().replace(/[^A-Z0-9]/g, '');
  const c = CLIENTS.find(x => x === mot || (mot === 'PRTECH' && x === 'PRTECH') || (mot === 'MRCONSEIL' && x === 'MRCONSEILS'));
  if (!c) return texte;
  choisirClient(c); return m[2];
}

/* ---------- Dictée (si le navigateur du téléphone la propose) ---------- */
const Reco = window.SpeechRecognition || window.webkitSpeechRecognition;
if (Reco){
  $('#micro').hidden = false;
  let reco = null;
  $('#micro').addEventListener('click', () => {
    if (reco){ reco.stop(); return; }
    reco = new Reco(); reco.lang = 'fr-FR'; reco.interimResults = true; reco.maxAlternatives = 1;
    const avant = $('#titre').value.trim();
    $('#micro').classList.add('ecoute');
    reco.onresult = e => {
      let t = ''; for (const r of e.results) t += r[0].transcript;
      $('#titre').value = (avant ? avant + ' ' : '') + t; majBouton();
    };
    reco.onerror = e => { if (e.error === 'not-allowed') message('Autorise le micro pour dicter', true); };
    reco.onend = () => {
      $('#micro').classList.remove('ecoute'); reco = null;
      const v = $('#titre').value.trim(); if (v) $('#titre').value = reconnaitreClient(v); majBouton();
    };
    reco.start();
  });
}

/* ---------- Envoi dans la tour (document « taches ») ---------- */
function normaliser(d){
  d = d && typeof d === 'object' ? d : {};
  return { ...d, taches: Array.isArray(d.taches) ? d.taches : [], auto: d.auto && typeof d.auto === 'object' ? d.auto : {}, jours: d.jours && typeof d.jours === 'object' ? d.jours : {}, seq: Number(d.seq) || 1 };
}
/* Relit, ajoute, enregistre si personne n'a écrit entre-temps ; sinon recommence (3 essais). */
async function envoyer(tache){
  for (let essai = 0; essai < 3; essai++){
    const { data, error } = await sb.from('cockpit_donnees').select('donnees, version').eq('cle', 'taches').maybeSingle();
    if (error) throw error;
    if (!data) throw new Error('premiere');
    const doc = normaliser(data.donnees);
    doc.taches.push({ id: doc.seq++, ...tache });
    const r = await sb.rpc('cockpit_enregistrer', { p_cle: 'taches', p_donnees: doc, p_version_lue: Number(data.version) });
    if (r.error) throw r.error;
    if (r.data && r.data.ok) return;
  }
  throw new Error('conflit');
}
$('#e-saisie').addEventListener('submit', async e => {
  e.preventDefault();
  let titre = $('#titre').value.trim(); if (!titre) return;
  titre = reconnaitreClient(titre);
  titre = titre.charAt(0).toUpperCase() + titre.slice(1);
  $('#envoyer').disabled = true; $('#envoyer').textContent = 'Envoi…';
  try{
    await envoyer({ c: client, t: titre, p: prio, ech: null, col: prio === 2 ? 'auj' : 'semaine', creeLe: isoJour(new Date()), depuis: 'telephone' });
    message(prio === 2 ? "Envoyé dans « Aujourd'hui » ✓" : 'Envoyé dans « À placer » ✓');
    $('#titre').value = ''; choisirPrio(0);
  }catch(err){
    const m = String(err && err.message || '');
    message(m === 'premiere' ? "Ouvre d'abord la tour de contrôle une fois sur l'ordinateur"
      : /refus|permission/i.test(m) ? "Ce compte n'est pas membre AP2M"
      : 'Pas envoyé : vérifie le réseau. Ta tâche est gardée, réessaie.', true);
  }
  $('#envoyer').textContent = 'Envoyer dans la tour'; majBouton();
});

/* ---------- Connexion ---------- */
$('#e-connexion').addEventListener('submit', async e => {
  e.preventDefault();
  $('#cx-erreur').textContent = ''; $('#cx-btn').textContent = 'Connexion…';
  const { error } = await sb.auth.signInWithPassword({ email: $('#cx-email').value.trim(), password: $('#cx-mdp').value });
  $('#cx-btn').textContent = 'Se connecter';
  if (error){ $('#cx-erreur').textContent = "Connexion refusée. Vérifie l'e-mail et le mot de passe."; return; }
  $('#cx-mdp').value = '';
});
let etat = null;
function surSession(session){
  const c = !!session; if (c === etat) return; etat = c;
  $('#e-connexion').hidden = c; $('#e-saisie').hidden = !c; $('#vers-tour').hidden = !c;
  if (c) setTimeout(() => $('#titre').focus(), 150);
}
sb.auth.onAuthStateChange((_evt, session) => surSession(session));
sb.auth.getSession().then(({ data }) => surSession(data.session));
</script>
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});</script>
</body>
</html>
